# Cloudflare Workers: the website, /menu and /admin are static files (dist/);
# the API and uploaded photos come from the Worker (cloudflare/worker.mjs) with data in D1.
name = "odecafe"
main = "cloudflare/worker.mjs"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# build the static files (pages + resized menu photos) before every deploy / dev run
[build]
command = "npm run build:static"

# dist/ is served first; anything that isn't a file there falls through to the Worker
[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"

# Create the database in the Cloudflare dashboard (Storage & Databases → D1 → "ode")
# and paste its ID here.
[[d1_databases]]
binding = "DB"
database_name = "ode"
database_id = "00000000-0000-0000-0000-000000000000"

[observability]
enabled = true

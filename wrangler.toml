# Cloudflare Workers: the website, /menu and /admin are static files (dist/);
# the API and uploaded photos come from the Worker (cloudflare/worker.mjs) with data in D1.
name = "odecafe"
main = "cloudflare/worker.mjs"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
# ADMIN_PASSWORD / SESSION_SECRET are set in the dashboard (Settings → Variables and secrets);
# keep them on every deploy instead of resetting to this file.
keep_vars = true

# build the static files (pages + resized menu photos) before every deploy / dev run
[build]
command = "npm run build:static"

# dist/ is served first; anything that isn't a file there falls through to the Worker
[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"

# D1 database "ode" in the Cloudflare account (Storage & Databases → D1)
[[d1_databases]]
binding = "DB"
database_name = "ode"
database_id = "a24040a0-2030-4eae-8f64-34b565fb1750"

[observability]
enabled = true

<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0c0a">
  <meta name="description" content="Ode — wine & kitchen in the heart of Tbilisi, 18 Giorgi Atoneli Street. Terrace, dining room and live piano.">
  <title>Ode — Wine & Kitchen · Tbilisi</title>
  <meta property="og:title" content="Ode — Wine & Kitchen">
  <meta property="og:description" content="Restaurant in the heart of Tbilisi · 18 Atoneli Street">
  <meta property="og:image" content="/img/site/terrace-1200.webp">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body class="site">
  <header class="topbar" id="topbar">
    <a class="brand" href="#top" aria-label="Ode"><img src="/img/logo-mark.webp" alt="Ode" width="474" height="296"></a>
    <div class="topbar-right">
      <a class="top-link" href="/menu" data-i18n="menu"></a>
      <button class="lang" id="langBtn" type="button" aria-label="Language / ენა">
        <span data-l="ka">ქა</span><span data-l="en">EN</span>
      </button>
    </div>
  </header>

  <!-- same header as the menu: photo + logo -->
  <section class="hero" id="top">
    <div class="hero-media"><img id="heroImg" alt="" fetchpriority="high" decoding="async"></div>
    <div class="hero-content">
      <p class="status" id="status"><i></i><span></span></p>
      <h1 class="hero-logo"><img src="/img/logo.webp" alt="Ode — wine & kitchen" width="474" height="394" fetchpriority="high"></h1>
      <a class="hero-addr" id="heroAddr" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span></span>
      </a>
    </div>
    <div class="hero-ctas">
      <a class="btn-solid" href="/menu" data-i18n="viewMenu"></a>
      <a class="btn-glass" href="#reserve" data-i18n="reserve"></a>
    </div>
  </section>

  <main>
    <!-- live piano -->
    <section class="block live" id="live">
      <div class="wrap">
        <figure class="live-card reveal">
          <img src="/img/site/live-640.webp" srcset="/img/site/live-640.webp 640w, /img/site/live-1200.webp 1200w" sizes="(min-width: 900px) 1080px, 100vw" alt="" loading="lazy" decoding="async" width="640" height="853">
          <figcaption>
            <p class="live-kicker"><i></i><span data-i18n="liveKicker"></span></p>
            <h2 data-i18n="liveTitle"></h2>
            <p class="live-time">20:00 <span>—</span> 23:30</p>
          </figcaption>
        </figure>
      </div>
    </section>

    <!-- about -->
    <section class="block about" id="about">
      <div class="wrap about-grid">
        <div class="about-text reveal">
          <p class="eyebrow" data-i18n="aboutEyebrow"></p>
          <p class="lead" data-i18n="aboutText"></p>
          <ul class="facts">
            <li data-i18n="factTerrace"></li>
            <li data-i18n="factHall"></li>
            <li data-i18n="factPiano"></li>
          </ul>
        </div>
        <figure class="ph about-photo reveal">
          <img src="/img/site/dining-640.webp" srcset="/img/site/dining-640.webp 640w, /img/site/dining-1200.webp 1200w" sizes="(min-width: 900px) 40vw, 100vw" alt="" loading="lazy" decoding="async" width="640" height="853">
        </figure>
      </div>
    </section>

    <!-- flavors -->
    <section class="block flavors" id="flavors">
      <div class="wrap">
        <div class="head reveal">
          <h2 data-i18n="flavorsTitle"></h2>
          <p data-i18n="flavorsText"></p>
          <a class="link-arrow" href="/menu"><span data-i18n="viewMenu"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
      </div>
      <div class="dishes strip" id="dishes"></div>
    </section>

    <!-- location -->
    <section class="block location" id="location">
      <figure class="wide reveal">
        <img src="/img/site/street-640.webp" srcset="/img/site/street-640.webp 640w, /img/site/street-1200.webp 1200w" sizes="(min-width: 900px) 50vw, 100vw" alt="" loading="lazy" decoding="async" width="640" height="853">
      </figure>
      <div class="loc-text reveal">
        <h2 data-i18n="locTitle"></h2>
        <p data-i18n="locText"></p>
        <dl class="info">
          <div><dt data-i18n="addressLabel"></dt><dd><a id="locAddr" target="_blank" rel="noopener"></a></dd></div>
          <div><dt data-i18n="hoursLabel"></dt><dd id="locHours"></dd></div>
        </dl>
        <a class="btn-outline" id="locMap" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <span data-i18n="directions"></span>
        </a>
      </div>
    </section>

    <!-- gallery -->
    <section class="block gallery" aria-label="Gallery">
      <div class="wrap"><p class="eyebrow reveal" data-i18n="galleryEyebrow"></p></div>
      <div class="gallery-row" id="galleryRow">
        <figure class="ph reveal"><img src="/img/site/terrace-640.webp" srcset="/img/site/terrace-640.webp 640w, /img/site/terrace-1200.webp 1200w" sizes="(min-width: 900px) 25vw, 80vw" alt="" loading="lazy" decoding="async" width="640" height="853"></figure>
        <figure class="ph reveal"><img src="/img/site/corner-640.webp" srcset="/img/site/corner-640.webp 640w, /img/site/corner-1200.webp 1200w" sizes="(min-width: 900px) 25vw, 80vw" alt="" loading="lazy" decoding="async" width="640" height="852"></figure>
        <figure class="ph reveal"><img src="/img/site/sign-640.webp" srcset="/img/site/sign-640.webp 640w, /img/site/sign-1200.webp 1200w" sizes="(min-width: 900px) 25vw, 80vw" alt="" loading="lazy" decoding="async" width="640" height="853"></figure>
        <figure class="ph reveal"><img src="/img/site/banquette-640.webp" srcset="/img/site/banquette-640.webp 640w, /img/site/banquette-1200.webp 1200w" sizes="(min-width: 900px) 25vw, 80vw" alt="" loading="lazy" decoding="async" width="640" height="852"></figure>
      </div>
      <div class="gallery-progress" aria-hidden="true"><span id="galleryBar"></span></div>
    </section>

    <!-- reservations -->
    <section class="block reserve" id="reserve">
      <div class="wrap reserve-card reveal">
        <img class="reserve-logo" src="/img/logo-mark.webp" alt="" width="474" height="296" loading="lazy">
        <h2 data-i18n="reserveTitle"></h2>
        <a class="reserve-phone" id="resPhone"></a>
        <div class="reserve-actions">
          <a class="btn-solid" id="resCall">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
            <span data-i18n="call"></span>
          </a>
          <a class="btn-outline" id="resWa" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9.5 8.5c0 3 3 6 6 6l1-1.5-2-1-1 .8a4 4 0 0 1-2.3-2.3l.8-1-1-2z" fill="currentColor" stroke="none"/></svg>
            <span>WhatsApp</span>
          </a>
        </div>
        <p class="reserve-hours" id="resHours"></p>
      </div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <button class="to-top" id="toTop" type="button" aria-label="Back to top">
    <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
  </button>

  <script src="/js/site.js" type="module"></script>
</body>
</html>
